name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Allow the workflow to push to the repo (needed to update docs/)
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run tests
        run: npm test

      - name: Generate Allure report
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run allure:generate

      - name: Update docs/ with latest reports
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          rm -rf docs/report
          cp -r reports/html docs/report
          rm -rf docs/allure
          cp -r reports/allure-html docs/allure

      - name: Commit and push updated reports to docs/
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/report docs/allure
          git diff --cached --quiet || git commit -m "chore: update GitHub Pages reports [skip ci]"
          git push

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/html

      - name: Upload test-results folder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
