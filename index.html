<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MultiBank Automation Report</title>
  <style>
    :root {
      --bg: #0b1220;
      --card: #111a2d;
      --text: #e7edf7;
      --muted: #9cb0d1;
      --accent: #39b06e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 20% 20%, #16233d 0%, var(--bg) 55%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 20px;
      border-bottom: 1px solid #20304f;
      background: rgba(11, 18, 32, 0.85);
      backdrop-filter: blur(4px);
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }

    .meta {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .container {
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .notice {
      background: var(--card);
      border: 1px solid #20304f;
      border-left: 4px solid var(--accent);
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
      color: var(--muted);
    }

    iframe {
      width: 100%;
      height: calc(100vh - 170px);
      border: 1px solid #20304f;
      border-radius: 10px;
      background: #fff;
    }

    a {
      color: #7bc1ff;
    }
  </style>
</head>
<body>
  <header>
    <h1>MultiBank Automation - Playwright Report</h1>
    <div class="meta">This page tries to load ./reports/html/index.html</div>
  </header>

  <main class="container">
    <div class="notice">
      If the report does not load on GitHub Pages, make sure the report files under <strong>reports/html</strong>
      are committed (they are often gitignored by default). You can also open it directly here:
      <a href="./reports/html/index.html">reports/html/index.html</a>
    </div>

    <iframe src="./reports/html/index.html" title="Playwright HTML Report"></iframe>
  </main>
</body>
</html>
